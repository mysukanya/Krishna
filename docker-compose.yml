version: '3.8'

services:
  krishna-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishna_autonomous_agent
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=mock
      - VECTOR_STORE_TYPE=chroma
      - LOG_LEVEL=INFO
      - MAX_ITERATIONS=10
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
